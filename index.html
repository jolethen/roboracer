<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>OLL RoboRacer Web Remote</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        h2 {
            text-align: center;
            color: #58a6ff;
            margin-bottom: 15px;
            font-size: 1.4rem;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #21262d;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .status-dot {
            height: 10px;
            width: 10px;
            background-color: #f85149;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }

        .status-dot.connected {
            background-color: #3fb950;
        }

        button {
            touch-action: manipulation;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.1s, transform 0.05s;
        }

        button:active {
            transform: scale(0.96);
        }

        .btn-primary {
            width: 100%;
            background-color: #238636;
            color: white;
            padding: 12px;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .btn-primary.connected {
            background-color: #da3633;
        }

        .grid-section {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-mode {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 10px;
            font-size: 0.85rem;
        }

        .btn-mode.active {
            background-color: #1f6feb;
            color: white;
            border-color: #388bfd;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            width: 240px;
            height: 240px;
            margin: 0 auto 20px auto;
        }

        .btn-drive {
            background-color: #30363d;
            color: #f0f6fc;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-drive:active {
            background-color: #58a6ff;
            color: #0d1117;
        }

        .btn-stop {
            background-color: #da3633;
            color: white;
            font-size: 0.9rem;
        }

        .empty {
            visibility: hidden;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🏎️ OLL RoboRacer</h2>

    <div class="status-bar">
        <span><span id="dot" class="status-dot"></span><span id="statusText">Disconnected</span></span>
        <span id="modeText" style="color: #8b949e;">MANUAL</span>
    </div>

    <button id="connectBtn" class="btn-primary">Connect Bluetooth</button>

    <div class="grid-section">
        <button id="btnManual" class="btn-mode active" onclick="sendCmd('M')">MANUAL</button>
        <button id="btnAuto" class="btn-mode" onclick="sendCmd('A')">SUB-AUTO</button>
    </div>

    <div class="dpad">
        <div class="empty"></div>
        <button class="btn-drive" onmousedown="sendCmd('F')" onmouseup="sendCmd('C')" ontouchstart="sendCmd('F'); event.preventDefault();" ontouchend="sendCmd('C'); event.preventDefault();">▲</button>
        <div class="empty"></div>

        <button class="btn-drive" onmousedown="sendCmd('L')" onmouseup="sendCmd('C')" ontouchstart="sendCmd('L'); event.preventDefault();" ontouchend="sendCmd('C'); event.preventDefault();">◀</button>
        <button class="btn-stop" onclick="sendCmd('S')">STOP</button>
        <button class="btn-drive" onmousedown="sendCmd('R')" onmouseup="sendCmd('C')" ontouchstart="sendCmd('R'); event.preventDefault();" ontouchend="sendCmd('C'); event.preventDefault();">▶</button>

        <div class="empty"></div>
        <button class="btn-drive" onmousedown="sendCmd('B')" onmouseup="sendCmd('C')" ontouchstart="sendCmd('B'); event.preventDefault();" ontouchend="sendCmd('C'); event.preventDefault();">▼</button>
        <div class="empty"></div>
    </div>

    <div class="grid-section">
        <button id="btnSafetyOn" class="btn-mode" onclick="sendCmd('X')">SAFETY ON</button>
        <button id="btnSafetyOff" class="btn-mode active" onclick="sendCmd('Y')">SAFETY OFF</button>
    </div>
</div>

<script>
    let bluetoothDevice;
    let txCharacteristic;

    const connectBtn = document.getElementById('connectBtn');
    const statusText = document.getElementById('statusText');
    const dot = document.getElementById('dot');
    const modeText = document.getElementById('modeText');

    const UART_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const UART_TX_CHARACTERISTIC_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';

    connectBtn.addEventListener('click', async () => {
        if (!bluetoothDevice || !bluetoothDevice.gatt.connected) {
            try {
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [UART_SERVICE_UUID]
                });

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(UART_SERVICE_UUID);
                txCharacteristic = await service.getCharacteristic(UART_TX_CHARACTERISTIC_UUID);

                statusText.innerText = 'Connected';
                dot.classList.add('connected');
                connectBtn.innerText = 'Disconnect';
                connectBtn.classList.add('connected');
            } catch (error) {
                console.error(error);
            }
        } else {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                bluetoothDevice.gatt.disconnect();
            }
            statusText.innerText = 'Disconnected';
            dot.classList.remove('connected');
            connectBtn.innerText = 'Connect Bluetooth';
            connectBtn.classList.remove('connected');
        }
    });

    async function sendCmd(cmd) {
        if (cmd === 'M') {
            document.getElementById('btnManual').classList.add('active');
            document.getElementById('btnAuto').classList.remove('active');
            modeText.innerText = 'MANUAL';
        } else if (cmd === 'A') {
            document.getElementById('btnAuto').classList.add('active');
            document.getElementById('btnManual').classList.remove('active');
            modeText.innerText = 'SUB-AUTO';
        } else if (cmd === 'X') {
            document.getElementById('btnSafetyOn').classList.add('active');
            document.getElementById('btnSafetyOff').classList.remove('active');
        } else if (cmd === 'Y') {
            document.getElementById('btnSafetyOff').classList.add('active');
            document.getElementById('btnSafetyOn').classList.remove('active');
        }

        if (txCharacteristic) {
            try {
                let encoder = new TextEncoder();
                await txCharacteristic.writeValue(encoder.encode(cmd));
            } catch (e) {
                console.error(e);
            }
        }
    }
</script>

</body>
  </html>
